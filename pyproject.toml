[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-compressor"
version = "0.1.0"
description = "Cross-platform lossless file compression desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography==44.0.3",
    "imageio[ffmpeg]==2.34.2",
    "Pillow==12.3.0",
    "platformdirs==4.3.8",
    "PySide6==6.8.3",
    "watchdog==4.0.2",
]

[project.scripts]
ls-compressor = "ls_compressor.cli.main:main"
ls-compressor-gui = "ls_compressor.gui.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ls_compressor.gui" = ["theme.qss"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
